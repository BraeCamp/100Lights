# Apollo (Helios engine) regression suite — pure-Node worklet harness, no
# browser. Runs the smoke test, the 115-check FX/filter A/B audit, and the
# completion audit on every push that touches the engine or its libraries,
# plus a repo-wide typecheck.
name: apollo-tests

on:
  push:
    paths:
      - 'public/apollo/**'
      - 'lib/apollo/**'
      - 'components/apps/apollo/**'
      - 'components/apps/Apollo.tsx'
      - 'scripts/apollo-tests/**'
      # The suite reaches OUTSIDE lib/apollo: patch.ts imports lib/scale-constants,
      # and the audits load app modules through scripts/lib/ts-import.mjs. Without
      # these, editing a dependency skips the suite entirely — the break lands with
      # no red at all, and the next commit that does touch lib/apollo/** goes red
      # and gets the blame. That is how 971e5ba's breakage came to look like
      # 3e923ef's.
      - 'lib/scale-constants.ts'
      - 'scripts/lib/**'
      - '.github/workflows/apollo-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Engine suite (smoke + fx audit + completion audit)
        run: npm run test:apollo
      - name: Typecheck
        run: npx tsc --noEmit
